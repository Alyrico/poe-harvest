name: Build

# Every push to main builds the installer (download it from the run's "Artifacts").
# Pushing a tag like v1.0.0 also publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, 'src'); import poe_harvest; print(poe_harvest.__version__)"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $v) { throw "Tag v$tag doesn't match __version__ $v in src/poe_harvest/__init__.py" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: python tools/test_app.py

      - name: Build the app folder (PyInstaller)
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/poe_harvest.spec

      - name: Add Tesseract (text reader)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./packaging/get_tesseract.ps1 -Dest "dist/PoE Harvest Tracker/tesseract"

      - name: Self-test the built app
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest.json"
          $p = Start-Process -FilePath "dist/PoE Harvest Tracker/PoE Harvest Tracker.exe" -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "The built app failed its self-test" }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: PoE-Harvest-Tracker-Setup-${{ steps.ver.outputs.version }}
          path: dist/PoE-Harvest-Tracker-Setup-*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = (Get-ChildItem dist/PoE-Harvest-Tracker-Setup-*.exe).FullName
          gh release create $env:GITHUB_REF_NAME $setup --title "PoE Harvest Tracker $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
